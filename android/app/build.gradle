plugins { id 'com.android.application'; id 'com.chaquo.python' }
// Sayfa ve köprü APK'ya gömülür: kumanda telefonda Termux olmadan, kendi içindeki köprüyle çalışır.
def SITE = ['index.html', 'manifest.webmanifest', 'sw.js', 'ikon-192.png', 'ikon-512.png', 'ikon-maskable-512.png']
def site = file('build/site/site'); site.mkdirs()
SITE.each { ad -> new File(site, ad).bytes = file("../../${ad}").bytes }
def py = file('src/main/python'); py.mkdirs()
new File(py, 'kumanda.py').bytes = file('../../kumanda.py').bytes
// Sürüm kodu: dakika cinsinden derleme zamanı. Kararlı ("apk") ve test ("test") derlemeleri aynı sırayı paylaşır,
// böylece hangisi daha yeniyse diğerinin üstüne kurulabilir.
def NO = (int) (System.currentTimeMillis().intdiv(60000) - 29000000L)
def TEST = System.getenv('KUMANDA_TEST') == '1'
if (TEST) {   // test kaynakları: ana kaynaklar + TEST şeritli simgeler (src/testapp/res) üstüne
    def hedef = file('build/res-test'); delete hedef
    copy { from 'src/main/res'; into hedef }
    copy { from 'src/testapp/res'; into hedef }
}
android {
    namespace 'com.azat.kumanda'
    compileSdk 35
    defaultConfig {
        // Test ayrı bir uygulamadır (Kumanda Test, com.azat.kumanda.test): kararlı Kumanda'yla yan yana kurulur,
        // kendi köprüsü (8081), kendi ayarları ve kendi simgesi (TEST şeritli) vardır.
        applicationId TEST ? 'com.azat.kumanda.test' : 'com.azat.kumanda'
        minSdk 26
        targetSdk 34
        versionCode NO
        versionName (TEST ? '1.1.' + NO + '-test' : '1.1.' + NO)
        resValue 'string', 'app_name', TEST ? 'Kumanda Test' : 'Kumanda'
        buildConfigField 'int', 'PORT', TEST ? '8081' : '8080'
        buildConfigField 'boolean', 'TEST', TEST ? 'true' : 'false'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }   // Python 3.12 yalnızca 64 bit
    }
    signingConfigs {
        imza {
            // Anahtar depoda durur: her derleme aynı imzayı taşır, yeni APK eskisinin üstüne kurulur.
            storeFile file('../kumanda.jks')
            storePassword 'kumanda'
            keyAlias 'kumanda'
            keyPassword 'kumanda'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.imza } }
    buildFeatures { buildConfig true }
    sourceSets {
        main.assets.srcDirs = ['build/site']
        main.res.srcDirs = [TEST ? 'build/res-test' : 'src/main/res']
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = '3.12'
        pyc { src = false }
    }
}
